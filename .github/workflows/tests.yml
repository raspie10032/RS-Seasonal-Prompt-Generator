name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
        # setup-python has no CPython 3.9 build for macOS ARM64.
        exclude:
          - os: macos-latest
            python: '3.9'
        include:
          - os: macos-15-intel
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install image test dependencies
        run: python -m pip install numpy Pillow
      - name: Run offline tests (no model downloads)
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
